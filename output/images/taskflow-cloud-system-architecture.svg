<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">TaskFlow Cloud System Architecture</title>
  <desc id="desc">A student browser connects to AWS Amplify, which communicates with an Amazon EC2 Flask API and an Amazon RDS PostgreSQL database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbff"/><stop offset="1" stop-color="#eaf4fb"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#102a43" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#1976c9"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="108" fill="#102a43"/>
  <text x="90" y="66" fill="#ffffff" font-family="Arial, sans-serif" font-size="38" font-weight="700">TaskFlow Cloud System Architecture</text>
  <text x="90" y="160" fill="#486581" font-family="Arial, sans-serif" font-size="23">Planned AWS deployment for the student task and study management application</text>

  <g filter="url(#shadow)">
    <rect x="82" y="350" width="260" height="230" rx="24" fill="#ffffff" stroke="#bdd3e3" stroke-width="2"/>
    <circle cx="212" cy="410" r="34" fill="#e1f0fb"/>
    <path d="M190 414h44M198 400h28M198 428h28" stroke="#146eb4" stroke-width="6" stroke-linecap="round"/>
    <text x="212" y="484" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="27" font-weight="700">Student Browser</text>
    <text x="212" y="522" text-anchor="middle" fill="#486581" font-family="Arial, sans-serif" font-size="19">React and Vite</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="462" y="350" width="260" height="230" rx="24" fill="#fff6e5" stroke="#f2c770" stroke-width="2"/>
    <rect x="542" y="381" width="100" height="52" rx="12" fill="#ff9900"/>
    <text x="592" y="415" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">AWS</text>
    <text x="592" y="484" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="27" font-weight="700">AWS Amplify</text>
    <text x="592" y="522" text-anchor="middle" fill="#486581" font-family="Arial, sans-serif" font-size="19">Frontend hosting</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="350" width="260" height="230" rx="24" fill="#e9f4fd" stroke="#9bc6e7" stroke-width="2"/>
    <rect x="922" y="381" width="100" height="52" rx="12" fill="#146eb4"/>
    <text x="972" y="415" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="20" font-weight="700">AWS</text>
    <text x="972" y="484" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="27" font-weight="700">Amazon EC2</text>
    <text x="972" y="522" text-anchor="middle" fill="#486581" font-family="Arial, sans-serif" font-size="19">Flask REST API</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1222" y="350" width="260" height="230" rx="24" fill="#eaf7ef" stroke="#9bd0ad" stroke-width="2"/>
    <ellipse cx="1352" cy="397" rx="48" ry="17" fill="#2f855a"/>
    <path d="M1304 397v50c0 10 22 17 48 17s48-7 48-17v-50" fill="#2f855a"/>
    <ellipse cx="1352" cy="447" rx="48" ry="17" fill="#236b47"/>
    <text x="1352" y="484" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="27" font-weight="700">Amazon RDS</text>
    <text x="1352" y="522" text-anchor="middle" fill="#486581" font-family="Arial, sans-serif" font-size="19">PostgreSQL database</text>
  </g>

  <path d="M342 465 H450" stroke="#1976c9" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M722 465 H830" stroke="#1976c9" stroke-width="7" marker-end="url(#arrow)"/>
  <path d="M1102 465 H1210" stroke="#1976c9" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="397" y="430" text-anchor="middle" fill="#486581" font-family="Arial, sans-serif" font-size="17" font-weight="700">HTTPS</text>
  <text x="777" y="430" text-anchor="middle" fill="#486581" font-family="Arial, sans-serif" font-size="17" font-weight="700">REST / JSON</text>
  <text x="1157" y="430" text-anchor="middle" fill="#486581" font-family="Arial, sans-serif" font-size="17" font-weight="700">SQL</text>

  <rect x="190" y="680" width="1220" height="112" rx="20" fill="#102a43"/>
  <text x="240" y="728" fill="#d9eaf7" font-family="Arial, sans-serif" font-size="22" font-weight="700">Request flow</text>
  <text x="240" y="764" fill="#ffffff" font-family="Arial, sans-serif" font-size="20">Students use the Amplify-hosted frontend. The Flask API on EC2 validates JWT access and stores task data in PostgreSQL on RDS.</text>
</svg>
