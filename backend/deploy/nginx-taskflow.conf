# Nginx reverse-proxy snippet (EC2). HTTPS is terminated here or at an ALB;
# Flask itself only listens on 127.0.0.1:8000. See docs/deployment.md.
server {
    listen 80;
    server_name api.example.com;  # <-- replace with your domain or EC2 DNS

    client_max_body_size 7M;  # just above UPLOAD_MAX_MB + form overhead

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
